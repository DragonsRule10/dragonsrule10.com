<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DragonsRule10</title>

    <meta
        name="description"
        content="DragonsRule10's personal page."
    >

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="style.css">

    <style>
        /* ================================
           PROFILE PAGE
           ================================ */

        body {
            overflow-x: hidden;
        }

        .profile-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .profile-card {
            width: 430px;
            max-width: 100%;
            text-align: center;

            padding: 28px;

            border-image: url('assets/guimenu.png');
            border-image-slice: 128 128 fill;
            border-image-width: 64px;

            image-rendering: pixelated;
        }

        /* Avatar */

        .avatar {
            width: 96px;
            height: 96px;

            margin: 0 auto 15px;

            image-rendering: pixelated;

            border: 4px solid #555;
            box-shadow:
                4px 4px 0 #222,
                inset 0 0 0 2px #aaa;

            background: #222;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        /* Name */

        .username {
            margin: 0;

            font-size: 32px;
            line-height: 1.2;

            color: #ffff55;

            text-shadow:
                3px 3px 0 #3f3f15;
        }

        .status {
            margin-top: 4px;

            color: #aaaaaa;
            font-size: 14px;

            text-shadow: 2px 2px 0 #222;
        }

        .bio {
            margin: 22px auto;

            max-width: 350px;

            color: #ffffff;
            font-size: 15px;
            line-height: 1.7;

            text-shadow: 2px 2px 0 #222;
        }

        /* Links */

        .links {
            display: grid;
            gap: 8px;

            margin-top: 20px;
        }

        .profile-button {
            display: block;

            width: 100%;
            height: 40px;

            line-height: 40px;

            background-image: url('assets/btn-minecraft.png');
            background-size: 100% 100%;

            image-rendering: pixelated;

            color: #ffffff;
            text-decoration: none;

            font-size: 14px;

            text-shadow: 2px 2px 0 #000;

            transition: filter 0.1s ease;
        }

        .profile-button:hover {
            background-image: url('assets/btn-minecraft-hover.png');

            color: #ffff55;

            text-shadow: 2px 2px 0 #000;

            filter: brightness(1.05);
        }

        /* Smaller links */

        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;

            margin-top: 18px;
        }

        .social-button {
            width: 64px;
            height: 64px;

            display: block;

            image-rendering: pixelated;
            background-size: cover;

            transition: transform 0.1s ease;
        }

        .social-button:hover {
            transform: translateY(-3px);
        }

        .github {
            background-image: url('assets/btn-github.png');
        }

        .github:hover {
            background-image: url('assets/btn-github-hover.png');
        }

        .youtube {
            background-image: url('assets/btn-youtube.png');
        }

        .youtube:hover {
            background-image: url('assets/btn-youtube-hover.png');
        }

        .patreon {
            background-image: url('assets/btn-patreon.png');
        }

        .patreon:hover {
            background-image: url('assets/btn-patreon-hover.png');
        }

        /* Footer */

        .footer {
            margin-top: 22px;

            color: #777;
            font-size: 10px;

            text-shadow: 1px 1px 0 #222;
        }

        /* Mobile */

        @media screen and (max-width: 530px) {

            .profile-card {
                padding: 22px;
            }

            .avatar {
                width: 80px;
                height: 80px;
            }

            .username {
                font-size: 26px;
            }

            .bio {
                font-size: 13px;
            }

            .profile-button {
                font-size: 12px;
            }

            .social-button {
                width: 56px;
                height: 56px;
            }
        }
    </style>
</head>


<body>

    <!-- Background blur -->
    <div class="backdrop-blur"></div>


    <main class="profile-wrapper">

        <div class="profile-card">

            <!--
                PROFILE PICTURE

                Replace this with your Minecraft skin/avatar if you want.
                Example:
                assets/avatar.png
            -->

            <div class="avatar">
                <img
                    src="assets/avatar.png"
                    alt="DragonsRule10"
                    onerror="this.style.display='none'"
                >
            </div>


            <!-- Name -->

            <h1 class="username">
                DragonsRule10
            </h1>

            <div class="status">
                ✦ IT • Homelab • Minecraft ✦
            </div>


            <!-- Bio -->

            <p class="bio">
                Just a guy who likes computers, servers,
                networking, Minecraft, and building random
                things that probably didn't need to be built.
            </p>


            <!-- Main links -->

            <div class="links">

                <a
                    class="profile-button"
                    href="https://github.com/DragonsRule10"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub
                </a>

                <a
                    class="profile-button"
                    href="https://dragonsrule10.com"
                >
                    My Website
                </a>

                <a
                    class="profile-button"
                    href="https://discord.com/users/956007823261700107"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Discord
                </a>

                <a
                    class="profile-button"
                    href="https://steamcommunity.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Steam
                </a>

            </div>


            <!-- Social icons -->

            <div class="social-links">

                <a
                    class="social-button github"
                    href="https://github.com/DragonsRule10"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="GitHub"
                ></a>

                <a
                    class="social-button youtube"
                    href="#"
                    aria-label="YouTube"
                ></a>

            </div>


            <div class="footer">
                dragonsrule10.com
            </div>

        </div>

    </main>


    <!-- Panorama toggle -->

    <a
        class="panorama-button"
        href="#"
        onclick="document.body.classList.toggle('static-panorama'); return false;"
        aria-label="Toggle panorama"
    ></a>

</body>
</html>
